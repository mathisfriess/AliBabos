name: CI Frontend-Alibabos

on:
  push:
    branches:
      - staging/frontend
  pull_request:
    branches:
      - staging/frontend

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-alibabos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Build
        run: npm run build
        
      - name: Run Cypress tests
        run: npm run test
        env:
          KEYCLOAK_CYPRESS_AUTH_BASE_URL: ${{ secrets.KEYCLOAK_CYPRESS_AUTH_BASE_URL }}
          KEYCLOAK_CYPRESS_AUTH_REALM: ${{ secrets.KEYCLOAK_CYPRESS_AUTH_REALM }}
          KEYCLOAK_CYPRESS_AUTH_CLIENT_ID: ${{ secrets.KEYCLOAK_CYPRESS_AUTH_CLIENT_ID }}
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}