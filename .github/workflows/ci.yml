name: CI Frontend-Alibabos

on:
  push:
    branches:
      - staging/frontend   # Déclenchement à chaque push sur la branche staging/frontend
  pull_request:
    branches:
      - staging/frontend   # Déclenchement à chaque PR vers la branche staging/frontend

jobs:
  build:
    runs-on: ubuntu-latest   # Utilise la dernière version stable d'Ubuntu

    defaults:
      run:
        working-directory: frontend-alibabos   # Toutes les commandes npm seront exécutées depuis ce dossier

    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v3
        # Clone le repository sur le runner pour accéder au code source

      # Étape 2 : Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
        # Installe Node.js version 20 pour pouvoir exécuter npm et build

      # Étape 3 : Installer les dépendances
      - name: Install dependencies
        run: npm install
        # Installe toutes les dépendances du projet (package.json)

      # Étape 4 : Vérification de la qualité du code
      - name: Lint code
        run: npm run lint
        # Exécute ESLint pour vérifier le style et la syntaxe du code

      # Étape 5 : Build du projet
      - name: Build
        run: npm run build
        # Compile le frontend pour générer le bundle de production