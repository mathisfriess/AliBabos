apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-rest
  template:
    metadata:
      labels:
        app: gateway-rest
    spec:
      containers:
        - name: gateway-rest
          image: alibabos/gateway-rest:latest
          ports:
            - containerPort: 8080
